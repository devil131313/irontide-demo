<style>
html,body{margin:0;background:#0A0A0B;color:#F1EDE4;font-family:"Inter Tight","Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased}
.gate{position:fixed;inset:0;z-index:60;background:#0A0A0B;display:flex;align-items:center;justify-content:center;padding:24px;box-sizing:border-box;transition:opacity .6s,visibility .6s}
.gate.hidden{opacity:0;visibility:hidden}
.gate form{width:100%;max-width:440px}
.gate .logos{display:flex;align-items:center;gap:16px;margin-bottom:28px}

.gate .sep{width:1px;height:34px;background:#F1EDE4;opacity:.45}
.gate .k{font-family:"JetBrains Mono",ui-monospace,Menlo,monospace;font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:#D4FF3A;margin:0 0 18px}
.gate label{display:block;margin-bottom:10px;color:#9C978E;font-size:17px}
.gate .fld{display:flex;gap:8px}
.gate input{flex:1;min-width:0;background:#141416;border:1px solid #29292E;color:#F1EDE4;padding:15px 14px;font-family:"JetBrains Mono",ui-monospace,Menlo,monospace;font-size:16px;border-radius:0;outline:none}
.gate input:focus{border-color:#D4FF3A}
.gate button{background:#D4FF3A;color:#0A0A0B;border:0;padding:0 22px 0 calc(22px + .12em);font-family:"JetBrains Mono",ui-monospace,Menlo,monospace;font-weight:500;letter-spacing:.12em;text-transform:uppercase;font-size:13px;cursor:pointer;min-width:92px}
.gate button[disabled]{opacity:.6;cursor:wait}
.gate .err{color:#FF6A5F;font-size:15px;min-height:22px;margin-top:10px}
.gate .hint{margin-top:14px;font-size:14px;color:#9C978E}
.gate .hint code{font-family:"JetBrains Mono",ui-monospace,Menlo,monospace;color:#F1EDE4}
.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
@media (prefers-reduced-motion:reduce){.shake{animation:none}.gate{transition:none}}

const gate=document.getElementById("gate"),form=document.getElementById("gate-form"),pw=document.getElementById("pw"),err=document.getElementById("err"),go=document.getElementById("go");
async function open(p){
  const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(p),"PBKDF2",false,["deriveKey"]);
  const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:u(P.s),iterations:P.n,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["decrypt"]);
  const html=new TextDecoder().decode(await crypto.subtle.decrypt({name:"AES-GCM",iv:u(P.i)},key,u(P.c)));
  const app=document.getElementById("app");
  app.innerHTML=html;
  app.querySelectorAll("script").forEach((old)=>{const s=document.createElement("script");s.textContent=old.textContent;old.replaceWith(s);});
  gate.classList.add("hidden");setTimeout(()=>gate.remove(),700);
  try{sessionStorage.setItem("pw",p)}catch(e){}
}
